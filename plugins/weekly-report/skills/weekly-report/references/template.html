<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>주간 성과 대시보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* 주간 성과 대시보드 견본 — 화면 구조는 고정, 내용은 아래 <script> 의 REPORT 객체만 바꾼다.
   섹션: 기간 버튼 → 한 줄 요약 → KPI 4칸 → 퍼널(산키) → 일별 방문 + 유입별 전환 → 콘텐츠 표 + 광고 → 다음 할 일 → 출처 */
:root {
  /* 브랜드 색 하나(--brand-base)만 바꾸면 연한 톤·막대·다크 모드가 따라온다. REPORT.brandColor 가 이 값을 덮어쓴다. */
  --brand-base: #2f8a45;
  --bg: #f7f7f5; --surface: #ffffff; --ink: #1a1d1b; --muted: #5f6662; --line: #e1e4e1;
  --brand: var(--brand-base); --brand-soft: color-mix(in srgb, var(--brand) 13%, var(--surface));
  --warn: #b5640f; --warn-soft: #fdf0e1; --bad: #b3372b;
  --bar: var(--brand); --bar-dim: color-mix(in srgb, var(--brand) 35%, var(--surface));
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121413; --surface: #1b1e1c; --ink: #e9ecea; --muted: #a0a7a3; --line: #2d322f;
  --brand: color-mix(in srgb, var(--brand-base) 62%, #ffffff); --warn: #f0a85a; --warn-soft: #3a2a17; --bad: #f08a7e;
  --bar-dim: color-mix(in srgb, var(--brand) 32%, var(--surface)); --on-brand: #121413; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121413; --surface: #1b1e1c; --ink: #e9ecea; --muted: #a0a7a3; --line: #2d322f;
  --brand: color-mix(in srgb, var(--brand-base) 62%, #ffffff); --warn: #f0a85a; --warn-soft: #3a2a17; --bad: #f08a7e;
  --bar-dim: color-mix(in srgb, var(--brand) 32%, var(--surface)); --on-brand: #121413; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.6; padding: 0 16px 64px; margin: 0; word-break: keep-all }
main { max-width: 1240px; margin: 0 auto; display: grid; gap: 24px }
h1, h2 { text-wrap: balance; margin: 0; line-height: 1.25 }
h1 { font-size: 28px; letter-spacing: -0.02em }
h2 { font-size: 18px }
p { margin: 0 }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums }
.muted { color: var(--muted) }
.eyebrow { font-size: 12px; letter-spacing: 0.08em; color: var(--brand); font-weight: 700 }
.topbar { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 14px 16px 12px; border-bottom: 1px solid var(--line); margin-inline: -16px }
.topbar-in { max-width: 1240px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between }
.brandname { font-weight: 700; font-size: 15px }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface) }
.seg button { font: 600 14px var(--font-body); color: var(--muted); background: transparent; border: 0; padding: 8px 14px; cursor: pointer; border-right: 1px solid var(--line); white-space: nowrap }
.seg button:last-child { border-right: 0 }
.seg button[aria-pressed="true"] { background: var(--brand); color: var(--on-brand, #fff) }
.seg small { font-weight: 500; opacity: .8; margin-left: 4px }
header.hd { display: grid; gap: 8px; padding-top: 8px }
.headline { font-size: 16px; max-width: 80ch }
section { display: grid; gap: 14px; min-width: 0 }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: grid; gap: 14px; align-content: start; min-width: 0 }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 4px; min-width: 0 }
.kpi .v { font-size: 30px; font-weight: 600 }
.kpi .l { font-size: 13px; color: var(--muted) }
.kpi .d { font-size: 12px; color: var(--muted) }
@media (max-width: 640px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)) } }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px }
@media (max-width: 760px) { .two { grid-template-columns: 1fr } }
.sankeywrap { overflow-x: auto; min-width: 0 }
.sankey { width: 100%; min-width: 640px; height: auto; display: block }
.sankey .nd { fill: var(--brand) } .sankey .ex { fill: var(--warn) }
.sankey .keep { fill: var(--brand); opacity: .35 } .sankey .drop { fill: var(--warn); opacity: .22 }
.sankey .nl { fill: var(--ink); font-size: 13px; font-weight: 700 }
.sankey .nv { fill: var(--ink); font-family: var(--font-num); font-size: 13px }
.sankey .ov { fill: var(--muted); font-size: 12px }
.sankey .cv { fill: var(--brand); font-size: 12px; font-weight: 700; font-family: var(--font-num) }
.sankey .cv.hot { fill: var(--bad) }
.sankey .nd0 { fill: none; stroke: var(--muted); stroke-dasharray: 3 3 }
.sankey .ol { fill: var(--warn); font-size: 13px; font-weight: 600 } .sankey .ol.good { fill: var(--brand) }
.sankey .hd { fill: var(--ink); font-size: 13px; font-weight: 700 }
.conv { font-size: 12px; color: var(--muted) }
.daily { display: flex; gap: 6px; align-items: flex-end; height: 230px; padding-top: 8px; border-bottom: 1px solid var(--line); overflow-x: auto }
.day { flex: 1 1 0; min-width: 34px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 6px; height: 100% }
.day .b { width: 72%; max-width: 46px; background: var(--bar-dim); border-radius: 5px 5px 0 0 }
.day.ev .b { background: var(--bar) }
.day .n { font-size: 12px } .day .t { font-size: 11px; color: var(--muted) }
.anno { font-size: 10.5px; line-height: 1.2; color: var(--brand); font-weight: 700; text-align: center; min-height: 26px; display: flex; flex-direction: column; justify-content: flex-end }
.anno:not(:empty)::after { content: "▼"; font-size: 9px }
.tablewrap { overflow-x: auto; min-width: 0 }
table { width: 100%; border-collapse: collapse; font-size: 14px }
th, td { padding: 9px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top }
th { font-size: 12px; color: var(--muted); font-weight: 500 }
td.r, th.r { text-align: right }
.bars { display: grid; gap: 8px }
.brow { display: grid; grid-template-columns: 150px minmax(0,1fr) 56px; gap: 10px; align-items: center }
@media (max-width: 480px) { .brow { grid-template-columns: 96px minmax(0,1fr) 48px } }
.track { height: 20px; background: var(--brand-soft); border-radius: 6px; overflow: hidden }
.fill { height: 100%; background: var(--bar); border-radius: 6px; min-width: 3px }
.adgrid { display: grid; gap: 18px }
.adgrid h3 { margin: 0; font-size: 14px }
ol.next { margin: 0; padding-left: 20px; display: grid; gap: 10px }
footer { font-size: 12px; color: var(--muted) }
.empty { font-size: 13px; color: var(--muted); padding: 12px; border: 1px dashed var(--line); border-radius: 10px }
</style>
</head>

      kpis: [['540', '방문자', '방문 622회'], ['31', '체험 신청', '카카오 11 · 네이버 9'], ['16', '첫 수업 참여', '체험자의 52%'], ['5', '유료 결제', '₩245,000']],
      funnel: { unit: '명', stages: [['방문', 622], ['수강 신청 클릭', 101], ['체험 신청', 31], ['첫 수업 참여', 16], ['유료 결제', 5]],
                drops: ['클릭 안 함', '신청 안 함', '수업 안 옴', '결제 안 함'], done: '결제 완료' },
      days: [['10/7', 70, '카카오 광고 시작'], ['10/8', 88, ''], ['10/9', 79, '알림톡 적용'], ['10/10', 95, '릴스 #4'], ['10/11', 102, ''], ['10/12', 110, '블로그 2편'], ['10/13', 78, '']],
      sources: { title: '유입 경로별 체험 신청', rows: [['카카오 광고', 11, ''], ['네이버 검색광고', 9, ''], ['인스타 자연', 8, '릴스 #4 이후 5명'], ['직접·미확인', 3, '']], note: '신청은 자체 DB 의 유입 기록(UTM) 기준.' },
      content: { title: '콘텐츠 조회', columns: ['콘텐츠', '인스타', '블로그'], rows: [['릴스 #4 반죽 3분 컷', '6,120', '–'], ['블로그 마카롱 실패 원인', '–', '980']], note: '10/13 밤 기준 누적 조회.' },
      ads: [
        { platform: '네이버 검색광고', tiles: [['₩98,000', '지출', '하루 ₩14,000'], ['3,010', '노출', '클릭 201'], ['9', '체험 신청', '신청당 ₩10,900']], note: '' },
        { platform: '카카오모먼트', tiles: [['₩120,000', '지출', '10/7–10/13'], ['48,200', '노출', '클릭 640'], ['11', '체험 신청', '신청당 ₩10,900']], note: '카카오 집계 전환 14, 자체 DB 11 — 차이는 본 뒤 나중 가입 포함.' }

      funnel: { unit: '명', stages: [['방문', 1032], ['수강 신청 클릭', 165], ['체험 신청', 49], ['첫 수업 참여', 22], ['유료 결제', 7]],

/* ===== 여기까지 ===== */

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const empty = what => `<p class="empty">${esc(what)} — 이 채널은 아직 연결 안 됨</p>`;

// 산키 퍼널: 단계 3~7개. 띠 굵기 = 사람 수, 초록 = 다음 단계로 간 사람, 주황 = 그 단계에서 멈춘 사람 → 오른쪽 '최종 결과'
function sankey(f) {
  const st = f.stages, v = st[0][1] || 1, n = st.length, k = 330 / v, MIN = 3, NW = 14, T = 62, GAP = 12, SHIFT = 30, XF = 1010;
  const H = x => x > 0 ? Math.max(MIN, x * k) : 0;
  const xs = st.map((_, i) => Math.round(30 + i * (860 - 30) / (n - 1)));
  const band = (x1, a1, b1, x2, a2, b2, cls) => { const m = (x1 + x2) / 2; return `<path class="${cls}" d="M${x1},${a1.toFixed(1)} C${m},${a1.toFixed(1)} ${m},${a2.toFixed(1)} ${x2},${a2.toFixed(1)} L${x2},${b2.toFixed(1)} C${m},${b2.toFixed(1)} ${m},${b1.toFixed(1)} ${x1},${b1.toFixed(1)} Z"/>`; };
  const last = st[n - 1][1];
  const outs = [['done', f.done || '끝까지 감', last]];
  for (let i = n - 2; i >= 0; i--) outs.push([i, (f.drops || [])[i] || `${st[i][0]}에서 멈춤`, st[i][1] - st[i + 1][1]]);
  const slot = {}; let y = T + SHIFT;
  for (const [key, , c] of outs) { const h = H(c); slot[key] = [y, y + h]; y += h + GAP + (c <= 0 ? 14 : 0); }
  const bands = [], nodes = [], texts = [], unit = f.unit || '';
  // 병목(빨강): funnel.bottleneck(i = i단계→다음) 이 있으면 그것만, 없으면 첫 칸(방문→행동, 원래 낮음)을 뺀 가장 낮은 전환
  const rate = i => st[i][1] ? st[i + 1][1] / st[i][1] : 0;
  let hotI = Number.isInteger(f.bottleneck) ? f.bottleneck : -1;
  if (hotI < 0 && n > 2) { hotI = 1; for (let i = 2; i < n - 1; i++) if (rate(i) < rate(hotI)) hotI = i; }
  st.forEach(([lab, c], i) => {
    const x = xs[i], h = H(c), ovp = c / v * 100;
    nodes.push(c > 0 ? `<rect class="nd" x="${x}" y="${T}" width="${NW}" height="${h.toFixed(1)}" rx="2"/>` : `<rect class="nd0" x="${x}" y="${T}" width="${NW}" height="10" rx="2"/>`);
    texts.push(`<text class="nl" x="${x}" y="${T - 38}">${esc(lab)}</text><text class="nv" x="${x}" y="${T - 22}">${c}${i ? ` <tspan class="ov">(전체 ${ovp < 10 ? ovp.toFixed(1) : Math.round(ovp)}%)</tspan>` : ''}</text>`);
    if (i < n - 1) {
      const nk = st[i + 1][1], kh = H(nk), pct = c ? nk / c * 100 : 0;
      if (nk > 0) bands.push(band(x + NW, T, T + kh, xs[i + 1], T, T + kh, 'keep'));
      const ty = kh > 12 ? T + kh / 2 + 4 : T - 6;
      texts.push(`<text class="cv${i === hotI ? ' hot' : ''}" x="${(x + NW + xs[i + 1]) / 2}" y="${ty.toFixed(1)}" text-anchor="middle">${Math.round(pct)}% →</text>`);
      if (c - nk > 0) { const [a, b] = slot[i]; bands.push(band(x + NW, T + kh, T + h, XF, a, b, 'drop')); }
    } else if (c > 0) { const [a, b] = slot.done; bands.push(band(x + NW, T, T + h, XF, a, b, 'keep')); }
  });
  for (const [key, lab, c] of outs) {
    const [a, b] = slot[key], good = key === 'done';
    if (c <= 0) { nodes.push(`<rect class="nd0" x="${XF}" y="${a}" width="${NW}" height="10" rx="2"/>`); texts.push(`<text class="ol${good ? ' good' : ''}" x="${XF + NW + 8}" y="${a + 9}">${esc(lab)} 0 · 아직 없음</text>`); continue; }
    nodes.push(`<rect class="${good ? 'nd' : 'ex'}" x="${XF}" y="${a.toFixed(1)}" width="${NW}" height="${(b - a).toFixed(1)}" rx="2"/>`);
    texts.push(`<text class="ol${good ? ' good' : ''}" x="${XF + NW + 8}" y="${((a + b) / 2 + 4).toFixed(1)}">${esc(lab)} ${c} · ${(c / v * 100).toFixed(1)}%</text>`);
  }
  texts.push(`<text class="hd" x="${XF}" y="${T - 38}">최종 결과</text><text class="nv" x="${XF}" y="${T - 22}">${v}${esc(unit)}이 어디서 멈췄나</text>`);
  return `<svg class="sankey" viewBox="0 0 1200 ${Math.ceil(y + 10)}" role="img" aria-label="${esc(st.map(s => s[0] + ' ' + s[1]).join(', '))}">${bands.join('')}${nodes.join('')}${texts.join('')}</svg>`;
}

const tiles = (arr, size) => `<div class="kpis"${size ? ` style="grid-template-columns:repeat(${Math.min(arr.length, 4)},minmax(0,1fr))"` : ''}>${arr.map(([v, l, s]) => `<div class="kpi"><span class="v num"${size ? ` style="font-size:${size}px"` : ''}>${esc(v)}</span><span class="l">${esc(l)}</span><span class="d">${esc(s)}</span></div>`).join('')}</div>`;

function render(p) {
  const d = REPORT.data[p];
  const days = d.days === 'concat' ? REPORT.periods.filter(x => x.id !== p && Array.isArray(REPORT.data[x.id]?.days)).flatMap(x => REPORT.data[x.id].days) : (d.days || []);
  const max = Math.max(...days.map(x => x[1] || 0), 1);
  const dayHtml = days.map(([t, n, ev]) => `<div class="day${ev ? ' ev' : ''}" title="${esc(t + (ev ? ' · ' + ev : ''))}"><span class="anno">${esc(ev)}</span><span class="n num">${n ?? '…'}</span><div class="b" style="height:${n ? Math.round(n / max * 150) : 0}px"></div><span class="t">${esc(t)}</span></div>`).join('');
  const src = d.sources || { rows: [] }, srcMax = Math.max(...src.rows.map(r => r[1]), 1);
  const ct = d.content || { rows: [] }, ads = d.ads || [];
  document.getElementById('view').innerHTML = `
  <header class="hd"><p class="eyebrow">${esc(d.eyebrow)}</p><h1>${esc(REPORT.title)}</h1><p class="headline">${esc(d.headline)}</p></header>
  <section aria-label="핵심 숫자">${tiles(d.kpis || [])}</section>
  <section class="panel"><h2>퍼널: ${esc(d.funnel.stages[0][0])}에서 ${esc(d.funnel.stages.at(-1)[0])}까지</h2>
    <div class="sankeywrap">${sankey(d.funnel)}</div>
    <p class="conv">띠 굵기 = 사람 수(아주 작은 값은 최소 굵기). 진한 색은 다음 단계로 간 사람, 주황(또는 회색)은 그 단계에서 멈춘 사람. 화살표 옆 %는 바로 앞 단계 대비(빨강 = 이번 주 병목), 괄호 안 %는 전체 대비.</p></section>
  <section class="two">
    <div class="panel"><h2>${esc(d.daysTitle || '일별 방문')}</h2>${days.length ? `<div class="daily" role="img" aria-label="일별 방문자">${dayHtml}</div><p class="muted" style="font-size:12px">▼와 진한 막대는 그날 있었던 일(게시·광고 시작 등).</p>` : empty('일별 방문')}</div>
    <div class="panel"><h2>${esc(src.title || '유입 경로별 전환')}</h2>${src.rows.length ? `<div class="bars">${src.rows.map(([n, c, note]) => `<div class="brow"><span style="font-size:14px">${esc(n)}</span><div class="track"><div class="fill" style="width:${(c / srcMax * 100).toFixed(0)}%"></div></div><span class="num" style="text-align:right">${c}</span></div>${note ? `<div class="muted" style="font-size:12px;margin-top:-4px">${esc(note)}</div>` : ''}`).join('')}</div>` : empty('유입 경로')}${src.note ? `<p class="muted" style="font-size:13px">${esc(src.note)}</p>` : ''}</div>
  </section>
  <section class="two">
    <div class="panel"><h2>${esc(ct.title || '콘텐츠')}</h2>${ct.rows.length ? `<div class="tablewrap"><table><thead><tr>${(ct.columns || []).map((c, i) => `<th${i ? ' class="r"' : ''}>${esc(c)}</th>`).join('')}</tr></thead><tbody>${ct.rows.map(r => `<tr>${r.map((c, i) => `<td${i ? ' class="r num"' : ''}>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>` : empty('SNS·콘텐츠')}${ct.note ? `<p class="muted" style="font-size:13px">${esc(ct.note)}</p>` : ''}</div>
    <div class="panel"><h2>광고</h2>${ads.length ? `<div class="adgrid">${ads.map(a => `<div style="display:grid;gap:10px"><h3>${esc(a.platform)}</h3>${tiles(a.tiles, 22)}${a.note ? `<p class="muted" style="font-size:13px">${esc(a.note)}</p>` : ''}</div>`).join('')}</div>` : empty('광고')}</div>
  </section>
  <section class="panel"><h2>다음 할 일</h2><ol class="next">${(d.next || []).map(x => `<li>${esc(x)}</li>`).join('')}</ol></section>
  <footer>출처: ${esc(d.foot)}</footer>`;
  document.querySelectorAll('#seg button').forEach(bt => bt.setAttribute('aria-pressed', bt.dataset.p === p ? 'true' : 'false'));
  try { localStorage.setItem('wr_period', p); } catch (e) {}
}

document.title = REPORT.brand;
document.getElementById('brand').textContent = REPORT.brand;
if (REPORT.brandColor) document.documentElement.style.setProperty('--brand-base', REPORT.brandColor);
if (REPORT.dropColor) document.documentElement.style.setProperty('--warn', REPORT.dropColor); // 브랜드가 주황·빨강 계열이면 '멈춘 사람' 색을 회색 등으로
document.getElementById('seg').innerHTML = REPORT.periods.map(x => `<button type="button" data-p="${esc(x.id)}">${esc(x.label)}<small>${esc(x.range)}</small></button>`).join('');
document.querySelectorAll('#seg button').forEach(bt => bt.addEventListener('click', () => render(bt.dataset.p)));
let start = REPORT.current;
const h = location.hash.slice(1); if (REPORT.data[h]) start = h; else { try { const s = localStorage.getItem('wr_period'); if (REPORT.data[s]) start = s; } catch (e) {} }
render(REPORT.data[start] ? start : REPORT.periods[0].id);
</script>
</body>
</html>
